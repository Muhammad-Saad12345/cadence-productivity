<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Cadence</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: ui-sans-serif, system-ui, sans-serif;
         background: #fafafc; color: #1e1e2e; }
  @media (prefers-color-scheme: dark) { body { background: #12121a; color: #ececf1; } p { color: #a1a1b5 !important; } }
  main { max-width: 22rem; padding: 2rem; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 1.15rem; margin: 1rem 0 .4rem; }
  p { color: #5f6075; font-size: .93rem; line-height: 1.5; }
  button { margin-top: 1rem; border: 0; border-radius: .6rem; padding: .6rem 1.1rem; font: inherit; font-weight: 600;
           background: #4f46e5; color: white; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>Cadence needs a connection to load your tasks. Reminder buttons you press while offline are saved and synced automatically when you're back.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
